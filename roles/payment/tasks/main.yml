- name: app setup
  ansible.builtin.import_role:
    name: common
    tasks_from: app-setup.yml
#change this part as latest python3-devel from repos have upgraded openssl-libs but other openssl packages are old in ami, so mismatch occured. we are upgrading befor installing python or after
- name: upgrade openssl packages
  ansible.builtin.dnf:
    name: {{ item }}
    state: latest
  loop:
    - openssl
    - openssl-libs
    - openssh
    - openssh-server
    - openssh-clients

- name: app setup
  ansible.builtin.import_role:
    name: common
    tasks_from: python.yml

- name: system setup
  ansible.builtin.import_role:
    name: common
    tasks_from: system-setup.yml